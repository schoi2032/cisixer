<!DOCTYPE html>



<head>
    <link rel ="icon" href="icon.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sixers - Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<div id="nav"></div>



<body>
    <div class="container">
        <header>
        <div class="logo-container">
            <h1>Chadwick International Sixers</h1>
        </div>
        <p class="subtitle">Login to Your Account</p>
        </header>
        <div id="nav"> </div>
    <section class="section home-bulletin-panel">
        <div class="login-container">
            <h3>Sign in to Sixers Website</h3>
            <p class="login-subtitle">Use your @chadwickschool.org email</p>
            
            <div id="error-message" class="error-message" style="display: none;"></div>
            
            <button id="google-signin-button" class="google-login-btn">
                <i class="fab fa-google"></i> Sign in with Google
            </button>
            
            <div class="login-info">
                <p><strong>ℹ️ Note:</strong> You must use a <strong>@chadwickschool.org</strong> email address to sign in.</p>
            </div>
        </div>
    </section>
    <div id="footer"></div>
  <script type="module" src="auth.js" defer></script>
</body>
