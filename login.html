<!DOCTYPE html>

//wefhij 

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sixers - Login (indev)</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script type="module" src="auth.js" defer></script>
    <script type="module" src="/dist/bundle.js"></script>
</head>

<div id="nav"></div>



<body>
    <div class="container">
        <header>
        <div class="logo-container">
            <h1>Chadwick International Sixers</h1>
        </div>
        <p class="subtitle">Login to Your Account</p>
        </header>
        <div id="nav"> </div>
    <section class="section home-bulletin-panel">
        <form>
            <h3>Login or Sign Up</h3>
            <label for="username">Username:</label>
            <input type="email" placeholder="Email" id="email" required>
            <br>

            <label for="password">Password:</label>
            <input type="password" placeholder="Password" id="password" required>
            <br>

            <button type="submit" id ="submit">Create Account</button>
            <div class="social">
                <div class="go" id = "google"><i class="fab fa-google"></i> Google</div>
                <div class="go" id = "facebook"><i class="fab fa-facebook-f"></i> Facebook... but who uses facebook</div>
            </div>
        </form>
    </section>
    <div id="footer"></div>
  <script src="script.js"></script>
</body>
